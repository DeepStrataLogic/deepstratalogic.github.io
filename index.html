<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://i.imgur.com/4Vp2qJd.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px); }

<body class="bg-grid min-h-screen flex flex-col justify-center items-center p-6">
    <main class="max-w-3xl w-full text-center space-y-8 bg-slate-900/80 p-12 rounded-2xl border border-slate-700 shadow-2xl backdrop-blur-sm">

        <div class="mx-auto w-48 h-auto p-2 flex items-center justify-center transition transform hover:scale-105">

        <div class="space-y-4">

            <p class="text-xl text-slate-400 font-light max-w-xl mx-auto">High-performance backend distributed systems, cloud infrastructure, and enterprise AI execution solutions.</p>
        </div>

        <div class="pt-8 border-t border-slate-800 flex justify-center">
            <a href="mailto:contact@deepstratalogic.com" class="text-cyan-400 hover:text-cyan-300 font-semibold transition text-lg">contact@deepstratalogic.com</a>

</html>
